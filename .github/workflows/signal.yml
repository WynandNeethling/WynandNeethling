name: build signal card

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/build_signal.py
      - .github/workflows/signal.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Render assets/signal.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/build_signal.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets/signal.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/signal.svg
            git commit -m "Refresh signal card"
            git push
          else
            echo "no change"
          fi
