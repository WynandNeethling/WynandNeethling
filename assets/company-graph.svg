      <rect x="318.4" y="137.0" width="83.2" height="30" rx="15" fill="#0E141B" stroke="#25313F" stroke-width="1.2"/>
      <rect x="318.4" y="137.0" width="83.2" height="30" rx="15" fill="none" stroke="#22D3EE" stroke-width="1.6" opacity="0"><animate attributeName="opacity" values="0;1;0.35" dur="7.0s" begin="1.27s" keyTimes="0;0.06;0.5" repeatCount="indefinite"/></rect>
      <circle cx="333.4" cy="152" r="3.4" fill="#22D3EE"/>
      <text x="368" y="156.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.3" fill="#D5DEEA">PROJECT</text>
    </g>
    <g>
      <circle cx="530" cy="82" r="30" fill="url(#qglow)" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="7.0s" begin="1.99s" keyTimes="0;0.06;0.22" repeatCount="indefinite"/></circle>
      <rect x="484.6" y="67.0" width="90.8" height="30" rx="15" fill="#0E141B" stroke="#25313F" stroke-width="1.2"/>
      <rect x="484.6" y="67.0" width="90.8" height="30" rx="15" fill="none" stroke="#F471B5" stroke-width="1.6" opacity="0"><animate attributeName="opacity" values="0;1;0.35" dur="7.0s" begin="1.99s" keyTimes="0;0.06;0.5" repeatCount="indefinite"/></rect>
      <circle cx="499.6" cy="82" r="3.4" fill="#F471B5"/>
      <text x="538" y="86.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.3" fill="#D5DEEA">DECISION</text>
    </g>
    <g>
      <circle cx="700" cy="152" r="30" fill="url(#qglow)" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="7.0s" begin="2.71s" keyTimes="0;0.06;0.22" repeatCount="indefinite"/></circle>
      <rect x="654.6" y="137.0" width="90.8" height="30" rx="15" fill="#0E141B" stroke="#25313F" stroke-width="1.2"/>
      <rect x="654.6" y="137.0" width="90.8" height="30" rx="15" fill="none" stroke="#22D3EE" stroke-width="1.6" opacity="0"><animate attributeName="opacity" values="0;1;0.35" dur="7.0s" begin="2.71s" keyTimes="0;0.06;0.5" repeatCount="indefinite"/></rect>
      <circle cx="669.6" cy="152" r="3.4" fill="#22D3EE"/>
      <text x="708" y="156.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.3" fill="#D5DEEA">DOCUMENT</text>
    </g>
    <g>
      <circle cx="872" cy="88" r="30" fill="url(#qglow)" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="7.0s" begin="3.43s" keyTimes="0;0.06;0.22" repeatCount="indefinite"/></circle>
      <rect x="826.6" y="73.0" width="90.8" height="30" rx="15" fill="#0E141B" stroke="#25313F" stroke-width="1.2"/>
      <rect x="826.6" y="73.0" width="90.8" height="30" rx="15" fill="none" stroke="#7C5CFF" stroke-width="1.6" opacity="0"><animate attributeName="opacity" values="0;1;0.35" dur="7.0s" begin="3.43s" keyTimes="0;0.06;0.5" repeatCount="indefinite"/></rect>
      <circle cx="841.6" cy="88" r="3.4" fill="#7C5CFF"/>
      <text x="880" y="92.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.3" fill="#D5DEEA">CUSTOMER</text>
    </g>
    <g>
      <circle cx="74" cy="120" r="26" fill="url(#qglow)"><animate attributeName="r" values="20;32;20" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="74" cy="120" r="18" fill="#0E141B" stroke="url(#qGrad)" stroke-width="2.2"/>
      <text x="74" y="127" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#22D3EE">?</text>
    </g>
    <circle r="4.5" fill="#FFFFFF">
      <animateMotion dur="7.0s" repeatCount="indefinite" keyTimes="0;0.55;1" keyPoints="0;1;1" calcMode="linear"><mpath xlink:href="#hop" href="#hop"/></animateMotion>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.55;0.6;1" dur="7.0s" repeatCount="indefinite"/>
    </circle>
    <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
      <text x="54" y="234" font-size="12.5" fill="#5C6B7E"><tspan fill="#22D3EE">&gt;</tspan> who owns the churn model, what did they decide in june, and which doc says why?</text>
    </g>
    <rect x="0.5" y="0.5" width="999" height="259" rx="18" fill="none" stroke="#1F2A37"/>
  </g>
</svg>
