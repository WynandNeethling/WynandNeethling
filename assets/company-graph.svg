<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Company knowledge graph traversal">
  <title>Company knowledge graph — one question, many hops</title>
  <defs>
    <linearGradient id="qGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C5CFF"/><stop offset="50%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#F471B5"/>
    </linearGradient>
    <pattern id="qgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#151D27" stroke-width="1"/>
    </pattern>
    <radialGradient id="qglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.5"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="qcard"><rect width="1000" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#qcard)">
    <rect width="1000" height="260" fill="#0B0F14"/>
    <rect width="1000" height="260" fill="url(#qgrid)" opacity="0.55"/>
    <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
      <text x="54" y="36" font-size="12" letter-spacing="3" fill="#8B97A8">COMPANY KNOWLEDGE GRAPH &#183; <tspan fill="#F471B5">ONE QUESTION, MANY HOPS</tspan></text>
    </g>
    <g stroke="#22D3EE" stroke-width="1" opacity="0.16" fill="none">
      <path d="M268 205 L360 152"/><path d="M452 40 L530 82"/><path d="M620 208 L700 152"/><path d="M800 42 L872 88"/><path d="M952 178 L872 88"/><path d="M150 190 L200 82"/>
      <path d="M268 205 L200 82"/><path d="M620 208 L530 82"/><path d="M452 40 L360 152"/>
    </g>
    <g fill="#0B0F14" stroke="#334155" stroke-width="1.5">
      <circle cx="268" cy="205" r="4"/>
      <circle cx="452" cy="40" r="4"/>
      <circle cx="620" cy="208" r="4"/>
      <circle cx="800" cy="42" r="4"/>
      <circle cx="952" cy="178" r="4"/>
      <circle cx="150" cy="190" r="4"/>
    </g>
    <path id="hop" d="M92 120 L200 82 L360 152 L530 82 L700 152 L872 88" fill="none" stroke="#1F2A37" stroke-width="2"/>
    <path d="M92 120 L200 82 L360 152 L530 82 L700 152 L872 88" fill="none" stroke="url(#qGrad)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1400" stroke-dashoffset="1400">
      <animate attributeName="stroke-dashoffset" values="1400;0;0;1400" keyTimes="0;0.55;0.85;1" dur="7.0s" repeatCount="indefinite"/>
    </path>
    <g>
