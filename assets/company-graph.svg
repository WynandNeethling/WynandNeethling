      <rect x="154.6" y="67.0" width="90.8" height="30" rx="15" fill="#0E141B" stroke="#25313F" stroke-width="1.2"/>
      <rect x="154.6" y="67.0" width="90.8" height="30" rx="15" fill="none" stroke="#7C5CFF" stroke-width="1.6" opacity="0"><animate attributeName="opacity" values="0;1;0.35" dur="7.0s" begin="0.55s" keyTimes="0;0.06;0.5" repeatCount="indefinite"/></rect>
      <circle cx="169.6" cy="82" r="3.4" fill="#7C5CFF"/>
      <text x="208" y="86.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.3" fill="#D5DEEA">EMPLOYEE</text>
