<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-label="footer">
  <defs>
    <linearGradient id="fGrad" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="960" y2="0">
      <stop offset="0%" stop-color="#7C5CFF"/><stop offset="50%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#F471B5"/>
    </linearGradient>
    <linearGradient id="fFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fcard"><rect width="1000" height="90" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#fcard)">
    <rect width="1000" height="90" fill="#0B0F14"/>
    <path id="fline" d="M40 46 L960 46" stroke="url(#fGrad)" stroke-width="1.6" fill="none" opacity="0.55" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" values="28;0" dur="1.9s" repeatCount="indefinite"/>
    </path>
    <g fill="#0B0F14" stroke-width="2">
      <circle cx="180" cy="46" r="5" stroke="#7C5CFF"><animate attributeName="r" values="4.5;7;4.5" dur="2.8s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="400" cy="46" r="5" stroke="#22D3EE"><animate attributeName="r" values="4.5;7;4.5" dur="2.8s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="46" r="5" stroke="#F471B5"><animate attributeName="r" values="4.5;7;4.5" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="46" r="5" stroke="#7C5CFF"><animate attributeName="r" values="4.5;7;4.5" dur="2.8s" begin="2.1s" repeatCount="indefinite"/></circle>
    </g>
    <circle r="3.4" fill="#FFFFFF" opacity="0.9"><animateMotion dur="4.6s" repeatCount="indefinite"><mpath xlink:href="#fline" href="#fline"/></animateMotion></circle>
    <circle r="2.6" fill="#F471B5" opacity="0.9"><animateMotion dur="4.6s" begin="2.3s" repeatCount="indefinite"><mpath xlink:href="#fline" href="#fline"/></animateMotion></circle>
    <text x="500" y="76" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="3.6" fill="#5C6B7E">GRAPHS &#183; CONTEXT &#183; ROBOTS</text>
    <rect x="-300" y="0" width="300" height="90" fill="url(#fFade)"><animate attributeName="x" values="-300;1000" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="0.5" y="0.5" width="999" height="89" rx="16" fill="none" stroke="#1F2A37"/>
  </g>
</svg>
