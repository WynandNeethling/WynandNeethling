<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-label="footer">
  <title>graphs · context · robots</title>
  <style>
    .flow { animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -26; } }
    .flow-slow { animation: flow-slow 2.4s linear infinite; }
    @keyframes flow-slow { to { stroke-dashoffset: 26; } }
    .halo { transform-box: fill-box; transform-origin: center; animation: halo 3.2s ease-in-out infinite; }
    @keyframes halo { 0%, 100% { transform: scale(0.85); opacity: 0.22; } 50% { transform: scale(1.5); opacity: 0.03; } }
    .blink { animation: blink 1.1s steps(1, end) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .sweep { animation: sweep 5.5s linear infinite; }
    @keyframes sweep { from { transform: translateX(-320px); } to { transform: translateX(1000px); } }

@keyframes fdot {
  0.00% { transform: translate(40.0px, 46.0px); }
  100.00% { transform: translate(960.0px, 46.0px); }
}  </style>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#151D27" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="90" rx="16"/></clipPath>
    <linearGradient id="fGrad" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="960" y2="0">
      <stop offset="0%" stop-color="#7C5CFF"/><stop offset="50%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#F471B5"/>
    </linearGradient>
    <linearGradient id="fFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="90" fill="#0B0F14"/>
    <rect width="1000" height="90" fill="url(#grid)" opacity="0.55"/>
    <path class="flow" d="M40 46 L960 46" stroke="url(#fGrad)" stroke-width="1.6" fill="none" opacity="0.55" stroke-dasharray="6 8"/>
    <circle class="halo" cx="180" cy="46" r="12" fill="#7C5CFF" style="animation-delay: 0.0s"/>
    <circle cx="180" cy="46" r="5" fill="#0B0F14" stroke="#7C5CFF" stroke-width="2"/>
    <circle class="halo" cx="400" cy="46" r="12" fill="#22D3EE" style="animation-delay: 0.7s"/>
    <circle cx="400" cy="46" r="5" fill="#0B0F14" stroke="#22D3EE" stroke-width="2"/>
    <circle class="halo" cx="620" cy="46" r="12" fill="#F471B5" style="animation-delay: 1.4s"/>
    <circle cx="620" cy="46" r="5" fill="#0B0F14" stroke="#F471B5" stroke-width="2"/>
    <circle class="halo" cx="840" cy="46" r="12" fill="#7C5CFF" style="animation-delay: 2.0999999999999996s"/>
    <circle cx="840" cy="46" r="5" fill="#0B0F14" stroke="#7C5CFF" stroke-width="2"/>
    <circle r="3.4" fill="#FFFFFF" opacity="0.9" style="animation: fdot 4.6s linear infinite"/>
    <circle r="2.6" fill="#F471B5" opacity="0.9" style="animation: fdot 4.6s linear 2.3s infinite"/>
    <text x="500" y="76" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="3.6" fill="#5C6B7E">GRAPHS &#183; CONTEXT &#183; ROBOTS</text>
    <rect class="sweep" x="0" y="0" width="300" height="90" fill="url(#fFade)"/>
    <rect x="0.5" y="0.5" width="999" height="89" rx="16" fill="none" stroke="#1F2A37"/>
  </g>
</svg>
