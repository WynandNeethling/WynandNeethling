<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Wynand Neethling — Founding AI Engineer at Ubundi">
  <title>Wynand Neethling — Founding AI Engineer @ Ubundi</title>
  <style>
    .flow { animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -26; } }
    .flow-slow { animation: flow-slow 2.4s linear infinite; }
    @keyframes flow-slow { to { stroke-dashoffset: 26; } }
    .halo { transform-box: fill-box; transform-origin: center; animation: halo 3.2s ease-in-out infinite; }
    @keyframes halo { 0%, 100% { transform: scale(0.85); opacity: 0.22; } 50% { transform: scale(1.5); opacity: 0.03; } }
    .blink { animation: blink 1.1s steps(1, end) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .sweep { animation: sweep 5.5s linear infinite; }
    @keyframes sweep { from { transform: translateX(-320px); } to { transform: translateX(1000px); } }

@keyframes pk0 {
  0.00% { transform: translate(790.0px, 140.0px); }
  100.00% { transform: translate(800.0px, 40.0px); }
}
@keyframes pk1 {
  0.00% { transform: translate(790.0px, 140.0px); }
  100.00% { transform: translate(905.0px, 168.0px); }
}
@keyframes pk2 {
  0.00% { transform: translate(790.0px, 140.0px); }
  100.00% { transform: translate(650.0px, 228.0px); }
}
@keyframes pk3 {
  0.00% { transform: translate(800.0px, 40.0px); }
  100.00% { transform: translate(930.0px, 78.0px); }
}
@keyframes pk4 {
  0.00% { transform: translate(945.0px, 225.0px); }
  100.00% { transform: translate(800.0px, 245.0px); }
}
@keyframes pk5 {
  0.00% { transform: translate(650.0px, 228.0px); }
  100.00% { transform: translate(700.0px, 148.0px); }
}
.rule { animation: rule 6s ease-in-out infinite; }
@keyframes rule { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(374px); } }
.hubring { transform-box: fill-box; transform-origin: center; animation: hubring 2.6s ease-in-out infinite; }
@keyframes hubring { 0%, 100% { transform: scale(0.8); } 50% { transform: scale(1.3); } }
.core { animation: core 1.3s ease-in-out infinite; }
@keyframes core { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }  </style>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#151D27" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="280" rx="18"/></clipPath>
    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="52" y1="0" x2="522" y2="0">
      <stop offset="0%" stop-color="#7C5CFF"/><stop offset="55%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#F471B5"/>
    </linearGradient>
    <linearGradient id="edgeGrad" gradientUnits="userSpaceOnUse" x1="640" y1="40" x2="950" y2="250">
      <stop offset="0%" stop-color="#7C5CFF"/><stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowVio"><stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.55"/><stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowCya"><stop offset="0%" stop-color="#22D3EE" stop-opacity="0.45"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="280" fill="#0B0F14"/>
    <rect width="1000" height="280" fill="url(#grid)" opacity="0.55"/>
    <ellipse cx="790" cy="140" rx="260" ry="170" fill="url(#glowVio)" opacity="0.35"/>
    <ellipse cx="120" cy="250" rx="220" ry="140" fill="url(#glowCya)" opacity="0.22"/>
    <g fill="none" stroke-linecap="round">
      <g class="flow" stroke="url(#edgeGrad)" stroke-width="1.4" opacity="0.75" stroke-dasharray="5 7">
        <path d="M790 140 L665 62"/>
        <path d="M790 140 L800 40"/>
        <path d="M790 140 L930 78"/>
        <path d="M790 140 L700 148"/>
        <path d="M790 140 L905 168"/>
        <path d="M790 140 L650 228"/>
        <path d="M790 140 L800 245"/>
        <path d="M790 140 L945 225"/>
      </g>
      <g class="flow-slow" stroke="#22D3EE" stroke-width="1" opacity="0.28" stroke-dasharray="3 6">
        <path d="M665 62 L800 40"/>
        <path d="M800 40 L930 78"/>
        <path d="M930 78 L905 168"/>
        <path d="M905 168 L945 225"/>
        <path d="M945 225 L800 245"/>
        <path d="M800 245 L650 228"/>
        <path d="M650 228 L700 148"/>
        <path d="M700 148 L665 62"/>
      </g>
    </g>
    <circle r="2.8" fill="#F471B5" style="animation: pk0 2.6s linear 0.0s infinite"/>
    <circle r="2.8" fill="#22D3EE" style="animation: pk1 3.1s linear 0.5s infinite"/>
    <circle r="2.8" fill="#7C5CFF" style="animation: pk2 2.9s linear 1.1s infinite"/>
    <circle r="2.8" fill="#22D3EE" style="animation: pk3 3.4s linear 0.8s infinite"/>
    <circle r="2.8" fill="#F471B5" style="animation: pk4 3.8s linear 1.6s infinite"/>
    <circle r="2.8" fill="#7C5CFF" style="animation: pk5 3.2s linear 2.1s infinite"/>
    <g>
      <circle class="halo" cx="665" cy="62" r="14" fill="#7C5CFF" style="animation-delay: 0.0s"/>
      <circle cx="665" cy="62" r="5.5" fill="#0B0F14" stroke="#7C5CFF" stroke-width="2"/>
    </g>
    <g>
      <circle class="halo" cx="800" cy="40" r="14" fill="#22D3EE" style="animation-delay: 0.4s"/>
      <circle cx="800" cy="40" r="5.5" fill="#0B0F14" stroke="#22D3EE" stroke-width="2"/>
    </g>
    <g>
      <circle class="halo" cx="930" cy="78" r="14" fill="#F471B5" style="animation-delay: 0.8s"/>
      <circle cx="930" cy="78" r="5.5" fill="#0B0F14" stroke="#F471B5" stroke-width="2"/>
    </g>
    <g>
      <circle class="halo" cx="700" cy="148" r="14" fill="#22D3EE" style="animation-delay: 1.2s"/>
      <circle cx="700" cy="148" r="5.5" fill="#0B0F14" stroke="#22D3EE" stroke-width="2"/>
    </g>
    <g>
      <circle class="halo" cx="905" cy="168" r="14" fill="#7C5CFF" style="animation-delay: 1.6s"/>
      <circle cx="905" cy="168" r="5.5" fill="#0B0F14" stroke="#7C5CFF" stroke-width="2"/>
    </g>
    <g>
      <circle class="halo" cx="650" cy="228" r="14" fill="#F471B5" style="animation-delay: 2.0s"/>
      <circle cx="650" cy="228" r="5.5" fill="#0B0F14" stroke="#F471B5" stroke-width="2"/>
    </g>
    <g>
      <circle class="halo" cx="800" cy="245" r="14" fill="#22D3EE" style="animation-delay: 2.4s"/>
      <circle cx="800" cy="245" r="5.5" fill="#0B0F14" stroke="#22D3EE" stroke-width="2"/>
    </g>
    <g>
      <circle class="halo" cx="945" cy="225" r="14" fill="#7C5CFF" style="animation-delay: 2.8s"/>
      <circle cx="945" cy="225" r="5.5" fill="#0B0F14" stroke="#7C5CFF" stroke-width="2"/>
    </g>
    <circle class="hubring" cx="790" cy="140" r="26" fill="url(#glowVio)"/>
    <circle cx="790" cy="140" r="9" fill="#0B0F14" stroke="url(#nameGrad)" stroke-width="2.5"/>
    <circle class="core" cx="790" cy="140" r="3.2" fill="#22D3EE"/>
    <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
      <text x="54" y="58" font-size="12" letter-spacing="3.4" fill="#22D3EE">UBUNDI &#183; STELLENBOSCH, ZA &#183; UTC+2</text>
      <text x="52" y="128" font-size="40" font-weight="700" letter-spacing="1.5" fill="url(#nameGrad)">WYNAND NEETHLING</text>
      <rect x="52" y="146" width="470" height="2" fill="#1F2A37"/>
      <rect class="rule" x="52" y="146" width="96" height="2" fill="url(#nameGrad)"/>
      <g font-size="13.5" fill="#8B97A8">
        <text x="54" y="180"><tspan fill="#7C5CFF">&#9656;</tspan> founding ai engineer &#183; <tspan fill="#C9D4E3">ubundi</tspan></text>
        <text x="54" y="204"><tspan fill="#22D3EE">&#9656;</tspan> knowledge graphs &#183; graphrag &#183; context-aware systems</text>
        <text x="54" y="228"><tspan fill="#F471B5">&#9656;</tspan> building the data engine for physical ai</text>
      </g>
      <rect class="blink" x="426" y="217" width="8" height="15" fill="#22D3EE"/>
    </g>
    <rect class="sweep" x="0" y="0" width="320" height="280" fill="url(#sweepGrad)"/>
    <rect x="0.5" y="0.5" width="999" height="279" rx="18" fill="none" stroke="#1F2A37"/>
  </g>
</svg>
