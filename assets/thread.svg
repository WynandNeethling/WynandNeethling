    <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace"><text x="28" y="30" font-size="10.5" letter-spacing="2.6" fill="#5C6B7E">THE THREAD &#183; <tspan fill="#7C5CFF">SAME QUESTION, NEW MODALITY</tspan></text></g>
    <rect x="0.5" y="0.5" width="999" height="239" rx="18" fill="none" stroke="#1F2A37"/>
