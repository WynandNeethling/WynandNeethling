      <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" text-anchor="middle">
        <text x="630" y="80" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#E4EAF2">FOUNDING AI ENGINEER</text>
        <text x="630" y="142" font-size="10" letter-spacing="0.6" fill="#5C6B7E">ubundi · stellenbosch</text>
      </g>
    </g>
    <g>
      <circle class="halo" cx="830" cy="62" r="14" fill="#22D3EE" style="animation-delay: 1.4s"/>
      <circle cx="830" cy="62" r="7" fill="#0B0F14" stroke="#22D3EE" stroke-width="2.2"/>
      <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" text-anchor="middle">
        <text x="830" y="28" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#E4EAF2">ENTERPRISE AI SOLUTIONS</text>
        <text x="830" y="44" font-size="10" letter-spacing="0.6" fill="#5C6B7E">agents &#183; mcps &#183; kgs</text>
      </g>
    </g>
    <g>
      <circle class="halo" cx="830" cy="168" r="14" fill="#F471B5" style="animation-delay: 2.0s"/>
      <circle cx="830" cy="168" r="7" fill="#0B0F14" stroke="#F471B5" stroke-width="2.2"/>
      <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" text-anchor="middle">
        <text x="830" y="199" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#E4EAF2">FIRST MOTIVE</text>
        <text x="830" y="216" font-size="10" letter-spacing="0.6" fill="#5C6B7E">the data engine for physical ai</text>
