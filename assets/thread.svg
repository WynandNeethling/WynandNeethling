  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#151D27" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="240" rx="18"/></clipPath>
    <linearGradient id="tGrad" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="660" y2="0">
      <stop offset="0%" stop-color="#7C5CFF"/><stop offset="55%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#F471B5"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="240" fill="#0B0F14"/>
    <rect width="1000" height="240" fill="url(#grid)" opacity="0.55"/>
    <path class="flow" d="M56 110 L660 110" stroke="url(#tGrad)" stroke-width="2" fill="none" stroke-dasharray="6 7" opacity="0.8"/>
    <path class="flow" d="M660 110 C 730 110, 760 62, 818 62" stroke="#22D3EE" stroke-width="1.6" fill="none" stroke-dasharray="5 7" opacity="0.7"/>
    <path class="flow" d="M660 110 C 730 110, 760 168, 818 168" stroke="#F471B5" stroke-width="1.6" fill="none" stroke-dasharray="5 7" opacity="0.7"/>
    <circle r="3.6" fill="#FFFFFF" style="animation: tspine 3.4s linear infinite"/>
    <circle r="3" fill="#22D3EE" style="animation: tbr1 3.4s linear 1.2s infinite"/>
    <circle r="3" fill="#F471B5" style="animation: tbr2 3.4s linear 2s infinite"/>
    <g>
