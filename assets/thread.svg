      <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" text-anchor="middle">
        <text x="150" y="80" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#E4EAF2">DATA ENGINEERING INTERN</text>
        <text x="150" y="142" font-size="10" letter-spacing="0.6" fill="#5C6B7E">capitec bank</text>
      </g>
    </g>
    <g>
